# Une sortie = une entrée ici + un service dans docker-compose.yml.
# pool : groupe choisi par le client avec -pool- dans son nom d'utilisateur (ex. user-pool-nordvpn).
# proxy_port : port publié de la sortie seule. proxy_url : son proxy interne, vers lequel relaie
# le proxy d'entrée (port 8080) et à travers lequel l'IP est mesurée.
# recover_after_seconds : reconnexion automatique après N s en "down" (120 par défaut, null = jamais).
# recover_interval_seconds : délai minimal entre deux reconnexions automatiques (300 par défaut).
# profile : sortie chargée seulement si ce profil Compose est dans COMPOSE_PROFILES (.env).
# Sortie mobile : agent_url est l'agent du téléphone, pool "mobile" par défaut. Pays : celui de la
# SIM, lu par l'agent (country: fr pour l'imposer). Pas de port à elle ni de reconnexion par le VPS :
# le téléphone se répare seul.
exits:
  - id: vpn-1
    type: vpn
    pool: nordvpn
    proxy_port: 8081
    proxy_url: http://gluetun:8888
    gluetun_control_url: http://gluetun:8000
    cooldown_seconds: 30
    max_attempts: 3
  - id: cyberghost-1
    type: vpn
    pool: cyberghost
    profile: cyberghost-1
    proxy_port: 8082
    proxy_url: http://gluetun-cyberghost-1:8888
    gluetun_control_url: http://gluetun-cyberghost-1:8000
    cooldown_seconds: 30
    max_attempts: 3
  - id: cyberghost-2
    type: vpn
    pool: cyberghost
    profile: cyberghost-2
    proxy_port: 8083
    proxy_url: http://gluetun-cyberghost-2:8888
    gluetun_control_url: http://gluetun-cyberghost-2:8000
    cooldown_seconds: 30
    max_attempts: 3
  - id: cyberghost-3
    type: vpn
    pool: cyberghost
    profile: cyberghost-3
    proxy_port: 8084
    proxy_url: http://gluetun-cyberghost-3:8888
    gluetun_control_url: http://gluetun-cyberghost-3:8000
    cooldown_seconds: 30
    max_attempts: 3
  - id: cyberghost-4
    type: vpn
    pool: cyberghost
    profile: cyberghost-4
    proxy_port: 8085
    proxy_url: http://gluetun-cyberghost-4:8888
    gluetun_control_url: http://gluetun-cyberghost-4:8000
    cooldown_seconds: 30
    max_attempts: 3
  - id: mobile-1
    type: mobile
    profile: mobile-1
    proxy_url: http://tunnel:13128
    agent_url: http://tunnel:19000
    cooldown_seconds: 60
    max_attempts: 3
