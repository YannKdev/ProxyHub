name: proxyhub

# Journaux Docker limités à 3 fichiers de 10 Mo par conteneur.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Commun à toutes les sorties VPN (une sortie = un conteneur Gluetun).
x-gluetun: &gluetun
  image: qmcgaw/gluetun:v3.41.3
  restart: unless-stopped
  logging: *logging
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun:/dev/net/tun

x-gluetun-env: &gluetun-env
  # Liste des serveurs du fournisseur remise à jour chaque jour, gardée dans le volume.
  UPDATER_PERIOD: 24h
  HTTPPROXY: "on"
  HTTPPROXY_USER: ${PROXY_USER:?set it in vps/.env}
  HTTPPROXY_PASSWORD: ${PROXY_PASSWORD:?set it in vps/.env}
  # Pas d'en-têtes de proxy ajoutés : l'IP du client n'est pas transmise au site.
  HTTPPROXY_STEALTH: "on"
  # Serveur de contrôle sur :8000, non publié, réservé au contrôleur.
  HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: '{"auth":"apikey","apikey":"${GLUETUN_API_KEY:?set it in vps/.env}"}'
  TZ: ${TZ:-Europe/Paris}

# Gluetun ne gère CyberGhost qu'en OpenVPN.
x-cyberghost-env: &cyberghost-env
  <<: *gluetun-env
  VPN_SERVICE_PROVIDER: cyberghost
  VPN_TYPE: openvpn

services:
  gluetun:
    <<: *gluetun
    ports:
      - "8081:8888"
    volumes:
      - gluetun-data:/gluetun
    environment:
      <<: *gluetun-env
      VPN_SERVICE_PROVIDER: nordvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:?set it in vps/.env}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-}

  # Sorties facultatives : lancées seulement si COMPOSE_PROFILES contient leur profil.
  # Pas de ${VAR:?} ici : Compose le vérifierait même profil inactif.
  # Gluetun refuse de démarrer si un identifiant, le certificat ou la clé manque.
  gluetun-cyberghost-1:
    <<: *gluetun
    profiles:
      - cyberghost-1
    ports:
      - "8082:8888"
    volumes:
      - gluetun-cyberghost-1-data:/gluetun
    environment:
      <<: *cyberghost-env
      OPENVPN_USER: ${CYBERGHOST_USER:-}
      OPENVPN_PASSWORD: ${CYBERGHOST_PASSWORD:-}
      OPENVPN_CERT: ${CYBERGHOST_CERT:-}
      OPENVPN_KEY: ${CYBERGHOST_KEY:-}
      SERVER_COUNTRIES: ${CYBERGHOST_COUNTRIES:-France}

  # Mêmes identifiants que la première sortie, sauf si CYBERGHOST_2_* est défini.
  gluetun-cyberghost-2:
    <<: *gluetun
    profiles:
      - cyberghost-2
    ports:
      - "8083:8888"
    volumes:
      - gluetun-cyberghost-2-data:/gluetun
    environment:
      <<: *cyberghost-env
      OPENVPN_USER: ${CYBERGHOST_2_USER:-${CYBERGHOST_USER:-}}
      OPENVPN_PASSWORD: ${CYBERGHOST_2_PASSWORD:-${CYBERGHOST_PASSWORD:-}}
      OPENVPN_CERT: ${CYBERGHOST_2_CERT:-${CYBERGHOST_CERT:-}}
      OPENVPN_KEY: ${CYBERGHOST_2_KEY:-${CYBERGHOST_KEY:-}}
      SERVER_COUNTRIES: ${CYBERGHOST_2_COUNTRIES:-${CYBERGHOST_COUNTRIES:-France}}

  # Accès direct depuis le VPS seulement : les clients passent par le proxy d'entrée (8080).
  gluetun-cyberghost-3:
    <<: *gluetun
    profiles:
      - cyberghost-3
    ports:
      - "127.0.0.1:8084:8888"
    volumes:
      - gluetun-cyberghost-3-data:/gluetun
    environment:
      <<: *cyberghost-env
      OPENVPN_USER: ${CYBERGHOST_3_USER:-${CYBERGHOST_USER:-}}
      OPENVPN_PASSWORD: ${CYBERGHOST_3_PASSWORD:-${CYBERGHOST_PASSWORD:-}}
      OPENVPN_CERT: ${CYBERGHOST_3_CERT:-${CYBERGHOST_CERT:-}}
      OPENVPN_KEY: ${CYBERGHOST_3_KEY:-${CYBERGHOST_KEY:-}}
      SERVER_COUNTRIES: ${CYBERGHOST_3_COUNTRIES:-${CYBERGHOST_COUNTRIES:-France}}

  gluetun-cyberghost-4:
    <<: *gluetun
    profiles:
      - cyberghost-4
    ports:
      - "127.0.0.1:8085:8888"
    volumes:
      - gluetun-cyberghost-4-data:/gluetun
    environment:
      <<: *cyberghost-env
      OPENVPN_USER: ${CYBERGHOST_4_USER:-${CYBERGHOST_USER:-}}
      OPENVPN_PASSWORD: ${CYBERGHOST_4_PASSWORD:-${CYBERGHOST_PASSWORD:-}}
      OPENVPN_CERT: ${CYBERGHOST_4_CERT:-${CYBERGHOST_CERT:-}}
      OPENVPN_KEY: ${CYBERGHOST_4_KEY:-${CYBERGHOST_KEY:-}}
      SERVER_COUNTRIES: ${CYBERGHOST_4_COUNTRIES:-${CYBERGHOST_COUNTRIES:-France}}

  # Sortie mobile : le téléphone ouvre ce tunnel SSH inversé et y expose son proxy (13128) et son
  # agent (19000). Ces deux ports restent sur le réseau Docker, seul 2222 est publié.
  tunnel:
    build: ./tunnel
    restart: unless-stopped
    logging: *logging
    profiles:
      - mobile-1
    ports:
      - "2222:2222"
    environment:
      TUNNEL_AUTHORIZED_KEY: ${TUNNEL_AUTHORIZED_KEY:-}
    volumes:
      - tunnel-keys:/etc/ssh/keys

  controller:
    build: ./controller
    restart: unless-stopped
    logging: *logging
    depends_on:
      - gluetun
    ports:
      # Proxy d'entrée unique : il choisit la sortie d'après le nom d'utilisateur.
      - "8080:8080"
      # API accessible seulement depuis le VPS. De l'extérieur, elle passe par Caddy (HTTPS).
      - "127.0.0.1:8090:8090"
    environment:
      API_TOKEN: ${API_TOKEN:?set it in vps/.env}
      PROXY_USER: ${PROXY_USER:?set it in vps/.env}
      PROXY_PASSWORD: ${PROXY_PASSWORD:?set it in vps/.env}
      GLUETUN_API_KEY: ${GLUETUN_API_KEY:?set it in vps/.env}
      # Les sorties marquées d'un profil dans exits.yaml ne sont chargées que si ce profil est actif.
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      # IP du client lue dans X-Forwarded-For, posé par Caddy. Le contrôleur n'est pas joignable
      # d'Internet, donc personne d'autre ne peut fournir cet en-tête.
      FORWARDED_ALLOW_IPS: "*"
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ./config:/config:ro
      - controller-data:/data

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      - controller
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set it in vps/.env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  gluetun-data:
  gluetun-cyberghost-1-data:
  gluetun-cyberghost-2-data:
  gluetun-cyberghost-3-data:
  gluetun-cyberghost-4-data:
  tunnel-keys:
  controller-data:
  caddy-data:
  caddy-config:
