name: proxyhub

# Journaux Docker limités à 3 fichiers de 10 Mo par conteneur.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    restart: unless-stopped
    logging: *logging
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8081:8888"
    volumes:
      - gluetun-data:/gluetun
    environment:
      VPN_SERVICE_PROVIDER: nordvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:?set it in vps/.env}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-}
      # Liste des serveurs NordVPN remise à jour chaque jour, gardée dans le volume.
      UPDATER_PERIOD: 24h
      HTTPPROXY: "on"
      HTTPPROXY_USER: ${PROXY_USER:?set it in vps/.env}
      HTTPPROXY_PASSWORD: ${PROXY_PASSWORD:?set it in vps/.env}
      # Pas d'en-têtes de proxy ajoutés : l'IP du client n'est pas transmise au site.
      HTTPPROXY_STEALTH: "on"
      # Serveur de contrôle sur :8000, non publié, réservé au contrôleur.
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: '{"auth":"apikey","apikey":"${GLUETUN_API_KEY:?set it in vps/.env}"}'
      TZ: ${TZ:-Europe/Paris}

  controller:
    build: ./controller
    restart: unless-stopped
    logging: *logging
    depends_on:
      - gluetun
    # Accessible seulement depuis le VPS. De l'extérieur, l'API passe par Caddy (HTTPS).
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      API_TOKEN: ${API_TOKEN:?set it in vps/.env}
      PROXY_USER: ${PROXY_USER:?set it in vps/.env}
      PROXY_PASSWORD: ${PROXY_PASSWORD:?set it in vps/.env}
      GLUETUN_API_KEY: ${GLUETUN_API_KEY:?set it in vps/.env}
      # IP du client lue dans X-Forwarded-For, posé par Caddy. Le contrôleur n'est pas joignable
      # d'Internet, donc personne d'autre ne peut fournir cet en-tête.
      FORWARDED_ALLOW_IPS: "*"
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ./config:/config:ro
      - controller-data:/data

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      - controller
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set it in vps/.env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  gluetun-data:
  controller-data:
  caddy-data:
  caddy-config:
