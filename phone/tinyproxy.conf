# Proxy du téléphone, joint seulement par le tunnel SSH (127.0.0.1), sans authentification.
# Le contrôleur ne lui envoie aucun identifiant : sans BasicAuth, tinyproxy transmettrait
# l'en-tête Proxy-Authorization au site.
Port 8888
Listen 127.0.0.1
Allow 127.0.0.1
Timeout 600
MaxClients 64
LogLevel Notice
DisableViaHeader Yes
ConnectPort 443
ConnectPort 80
